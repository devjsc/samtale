[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "samtale"
version = "0.1.1"
description = "A modern, minimal messaging framework for agents."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Joshua Croft" }
]
keywords = [
    "agents",
    "messaging",
    "multi-agent",
    "asyncio",
    "http"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "httpx",
    "pydantic>=2",
    "starlette",
    "uvicorn",
]

[project.urls]
Homepage = "https://github.com/devjc/samtale"
Repository = "https://github.com/devjc/samtale"
Issues = "https://github.com/devjc/samtale/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/samtale"]