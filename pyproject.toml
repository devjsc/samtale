[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "samtale"
version = "0.1.0"
description = "Minimal typed HTTP messaging for independent Python agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.0",
  "starlette>=0.40",
  "uvicorn>=0.29",
]

[tool.setuptools.packages.find]
include = ["samtale*"]
